<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NecoTrack</title>
<meta name="theme-color" content="#1a1510">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NecoTrack">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png" id="apple-icon">
<link rel="manifest" href="#" id="manifest-link">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-logo">
    <img src="logo.png" alt="NecoTrack" style="height:56px; object-fit:contain;">
    <small data-i18n="tagline"></small>
  </div>
  <div class="auth-card">
    <h2 data-i18n="authTitle"></h2>
    <p data-i18n="authDesc"></p>
    <button class="btn-primary" onclick="startOAuth()" data-i18n="authOAuth"></button>
    <div class="divider" data-i18n="authDivider"></div>
    <div class="token-input-wrap">
      <label data-i18n="tokenLabel"></label>
      <input type="password" id="manual-token" data-i18n-ph="tokenPlaceholder">
    </div>
    <button class="btn-primary" onclick="loginWithToken()" data-i18n="authLogin"></button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="header-logo"><img src="logo.png" alt="NecoTrack" style="height:56px; object-fit:contain; display:block;"></div>
    <div class="header-right">
      <div class="user-chip" id="user-chip">
        <img src="" alt="" class="user-avatar" id="user-avatar">
        <span id="user-name">—</span>
      </div>
      <button class="btn-icon" onclick="loadList()" data-i18n-title="refresh">↻</button>
      <button class="btn-icon" onclick="logout()" data-i18n="logout"></button>
    </div>
  </header>

  <div class="tabs-wrap">
    <div class="tabs">
      <button class="tab active" data-tab="CURRENT"   onclick="setTab('CURRENT',this)" data-i18n="status.CURRENT"></button>
      <button class="tab"        data-tab="ALL"       onclick="setTab('ALL',this)" data-i18n="tabAll"></button>
      <button class="tab"        data-tab="COMPLETED" onclick="setTab('COMPLETED',this)" data-i18n="status.COMPLETED"></button>
      <button class="tab"        data-tab="PLANNING"  onclick="setTab('PLANNING',this)" data-i18n="status.PLANNING"></button>
      <button class="tab"        data-tab="PAUSED"    onclick="setTab('PAUSED',this)" data-i18n="status.PAUSED"></button>
      <button class="tab"        data-tab="DROPPED"   onclick="setTab('DROPPED',this)" data-i18n="status.DROPPED"></button>
    </div>
  </div>

  <div class="controls">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input type="text" id="search-input" data-i18n-ph="searchPlaceholder" oninput="onSearchInput(this.value)">
      <div id="catalog-results" class="catalog-dropdown" style="display:none"></div>
    </div>
    <select class="filter-select" id="sort-select" onchange="renderList()">
      <option value="title"    data-i18n="sortTitle"></option>
      <option value="score"    data-i18n="sortScore"></option>
      <option value="progress" data-i18n="sortProgress"></option>
      <option value="updated"  data-i18n="sortUpdated"></option>
      <option value="year"     data-i18n="sortYear"></option>
    </select>
    <div class="toggle-group">
      <button class="toggle-btn active" id="toggle-group" onclick="toggleGrouping(true)" data-i18n="groupOn"></button>
      <button class="toggle-btn" id="toggle-flat" onclick="toggleGrouping(false)" data-i18n="groupOff"></button>
    </div>
  </div>

  <main>
    <div class="stats-bar" id="stats-bar"></div>
    <div id="list-container"></div>
  </main>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <div class="modal-header">
      <img src="" class="modal-cover" id="modal-cover">
      <div class="modal-title-wrap">
        <div class="modal-title" id="modal-title">—</div>
        <div class="modal-subtitle" id="modal-subtitle">—</div>
      </div>
      <button class="btn-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="field-group">
        <div class="field-label" data-i18n="fldStatus"></div>
        <div class="status-row">
          <button class="status-btn" data-status="CURRENT"   onclick="setModalStatus('CURRENT')"   data-i18n="status.CURRENT"></button>
          <button class="status-btn" data-status="COMPLETED" onclick="setModalStatus('COMPLETED')" data-i18n="status.COMPLETED"></button>
          <button class="status-btn" data-status="PLANNING"  onclick="setModalStatus('PLANNING')"  data-i18n="status.PLANNING"></button>
          <button class="status-btn" data-status="PAUSED"    onclick="setModalStatus('PAUSED')"    data-i18n="status.PAUSED"></button>
          <button class="status-btn" data-status="DROPPED"   onclick="setModalStatus('DROPPED')"   data-i18n="status.DROPPED"></button>
        </div>
      </div>
      <div class="field-group">
        <div class="field-label" data-i18n="fldScore"></div>
        <div class="score-row" id="score-row"></div>
      </div>
      <div class="field-group">
        <div class="field-label" data-i18n="fldProgress"></div>
        <div class="progress-row">
          <button class="btn-prog" onclick="adjustProgress(-1)">−</button>
          <input type="number" id="modal-progress" min="0" value="0">
          <span>/ <span id="modal-total">?</span> <span data-i18n="epShort"></span></span>
          <button class="btn-prog" onclick="adjustProgress(1)">+</button>
        </div>
      </div>
      <div class="field-group">
        <div class="field-label" data-i18n="fldNotes"></div>
        <textarea class="notes-input" id="modal-notes" data-i18n-ph="notesPlaceholder"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-delete" onclick="deleteEntry()" data-i18n="delete"></button>
      <button class="btn-cancel" onclick="closeModal()" data-i18n="cancel"></button>
      <button class="btn-save" onclick="saveEntry()" data-i18n="save"></button>
    </div>
  </div>
</div>

<!-- INFO MODAL -->
<div class="modal-overlay" id="info-modal">
  <div class="modal">
    <div class="modal-header" style="padding-bottom:0; border-bottom:none; gap:10px;">
      <div class="modal-title-wrap">
        <div class="modal-title" id="info-title">—</div>
        <div class="modal-subtitle" id="info-subtitle">—</div>
      </div>
      <button class="btn-close" onclick="closeInfoModal()">✕</button>
    </div>
    <div class="modal-body" id="info-body">
      <div class="loading"><div class="spinner"></div><div data-i18n="loading"></div></div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeInfoModal()" data-i18n="close"></button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="strings.js"></script>
<script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NecoTrack</title>
<meta name="theme-color" content="#1a1510">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NecoTrack">
<link rel="apple-touch-icon" href="#" id="apple-icon">
<link rel="manifest" href="#" id="manifest-link">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* Warm soft-dark palette */
    --bg:        #151210;
    --surface:   #1e1a16;
    --surface2:  #262018;
    --surface3:  #302820;
    --border:    #3a2e24;
    --border-hi: #4e3d2e;

    /* Accent: warm coral-peach, close to #FFBCAC */
    --accent:      #f0a898;
    --accent-dim:  rgba(240,168,152,0.13);
    --accent-glow: rgba(240,168,152,0.07);
    --accent-hover:#ffcabc;

    /* Text */
    --text:       #f0e8e0;
    --text-dim:   #9e8e82;
    --text-muted: #5e4e44;

    /* Status colors — all warm-adjusted */
    --green:  #82d4a0;
    --yellow: #f0c878;
    --red:    #e87878;
    --blue:   #90bcd8;

    --radius:    12px;
    --radius-sm: 7px;
    --radius-xs: 4px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
  }

  /* ── AUTH ── */
  #auth-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    gap: 28px;
    background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(240,168,152,0.06) 0%, transparent 70%);
  }

  .auth-logo {
    font-family: 'Nunito', sans-serif;
    font-size: 40px;
    font-weight: 800;
    letter-spacing: -1.5px;
    color: var(--text);
  }
  .auth-logo span { color: var(--accent); }
  .auth-logo small {
    display: block;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.5px;
    color: var(--text-muted);
    text-align: center;
    margin-top: -4px;
  }

  .auth-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 36px 32px;
    max-width: 390px;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 18px;
    align-items: center;
    text-align: center;
  }

  .auth-card h2 {
    font-family: 'Nunito', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }

  .auth-card p {
    color: var(--text-dim);
    font-size: 13px;
    line-height: 1.6;
  }

  .btn-primary {
    background: var(--accent);
    color: #1a0e0a;
    border: none;
    padding: 12px 28px;
    border-radius: var(--radius-sm);
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    width: 100%;
    letter-spacing: 0.2px;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:active { transform: scale(0.98); }

  .token-input-wrap {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .token-input-wrap label {
    font-size: 12px;
    color: var(--text-dim);
    text-align: left;
  }
  .token-input-wrap input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 10px 14px;
    width: 100%;
    outline: none;
    transition: border-color 0.15s;
  }
  .token-input-wrap input:focus { border-color: var(--accent); }

  .divider {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text-muted);
    font-size: 11px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── APP ── */
  #app { display: none; flex-direction: column; min-height: 100vh; }

  /* HEADER */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-logo {
    font-family: 'Nunito', sans-serif;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text);
  }
  .header-logo span { color: var(--accent); }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .user-chip {
    display: flex;
    align-items: center;
    gap: 7px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 11px 3px 3px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
  }

  .user-avatar {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--surface3);
  }

  .btn-icon {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-dim);
    cursor: pointer;
    padding: 5px 10px;
    font-size: 13px;
    transition: color 0.15s, border-color 0.15s;
    font-family: 'DM Sans', sans-serif;
  }
  .btn-icon:hover { color: var(--text); border-color: var(--accent); }

  /* TABS */
  .tabs-wrap {
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    position: sticky;
    top: 54px;
    z-index: 90;
  }
  .tabs-wrap::-webkit-scrollbar { display: none; }

  .tabs {
    display: flex;
    padding: 10px 16px 0;
    min-width: max-content;
    gap: 2px;
  }

  .tab {
    padding: 7px 16px;
    border-radius: var(--radius-sm) var(--radius-sm) 0 0;
    border: 1px solid transparent;
    border-bottom: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: color 0.15s, background 0.15s;
    font-family: 'DM Sans', sans-serif;
    white-space: nowrap;
    letter-spacing: 0.1px;
  }
  .tab.active {
    background: var(--surface);
    border-color: var(--border);
    color: var(--text);
  }
  .tab:not(.active):hover { color: var(--text-dim); }

  /* CONTROLS */
  .controls {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 180px;
    max-width: 380px;
  }
  .search-wrap input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 7px 12px 7px 32px;
    width: 100%;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-wrap input::placeholder { color: var(--text-muted); }
  .search-wrap input:focus { border-color: var(--accent); }

  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 15px;
    pointer-events: none;
    line-height: 1;
  }

  .catalog-dropdown {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    z-index: 200;
    max-height: 360px;
    overflow-y: auto;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5);
  }

  .catalog-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  .catalog-item:last-child { border-bottom: none; }
  .catalog-item:hover { background: var(--surface2); }

  .catalog-cover {
    width: 28px;
    height: 40px;
    object-fit: cover;
    border-radius: 3px;
    background: var(--surface3);
    flex-shrink: 0;
  }

  .catalog-info { flex: 1; min-width: 0; }
  .catalog-title {
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }
  .catalog-meta {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 1px;
  }

  .catalog-add {
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    border-radius: var(--radius-xs);
    color: var(--accent);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    cursor: pointer;
    white-space: nowrap;
    font-family: 'DM Sans', sans-serif;
    transition: background 0.12s;
    flex-shrink: 0;
  }
  .catalog-add:hover { background: var(--accent); color: #1a0e0a; }
  .catalog-add.in-list { background: transparent; border-color: var(--border); color: var(--text-muted); cursor: default; }

  .catalog-loading {
    padding: 16px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
  }

  .search-mode-hint {
    font-size: 10px;
    color: var(--text-muted);
    padding: 7px 12px 4px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .search-mode-hint button {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 11px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    padding: 0;
  }

  select.filter-select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 7px 10px;
    outline: none;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  select.filter-select:focus { border-color: var(--accent); }

  .toggle-group {
    display: flex;
    gap: 2px;
    margin-left: auto;
  }
  .toggle-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 10px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.15s;
  }
  .toggle-btn:first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
  .toggle-btn:last-child { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
  .toggle-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

  /* MAIN */
  main {
    padding: 18px 20px;
    flex: 1;
  }

  /* STATS */
  .stats-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .stat-chip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 500;
  }
  .stat-chip strong { color: var(--accent); font-weight: 700; margin-right: 4px; }

  /* ── LIST ── */
  .anime-list { display: flex; flex-direction: column; gap: 0; }

  /* SERIES GROUP (multi-season) */
  .series-group {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 8px;
    transition: border-color 0.2s;
  }
  .series-group:hover { border-color: var(--border-hi); }

  .series-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    cursor: pointer;
    user-select: none;
  }

  .series-cover {
    width: 56px;
    height: 80px;
    object-fit: cover;
    border-radius: 6px;
    background: var(--surface3);
    flex-shrink: 0;
  }

  .series-info { flex: 1; min-width: 0; }

  .series-title {
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.3;
    color: var(--text);
  }

  .series-meta {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 5px;
    flex-wrap: wrap;
  }

  .season-count {
    font-size: 11px;
    color: var(--text-muted);
    background: var(--surface3);
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
  }

  .series-score-avg {
    font-size: 12px;
    font-weight: 700;
    color: var(--yellow);
    display: flex;
    align-items: center;
    gap: 3px;
  }

  .chevron {
    color: var(--text-muted);
    font-size: 11px;
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .series-group.open .chevron { transform: rotate(90deg); }

  .seasons-list { border-top: 1px solid var(--border); }

  /* SEASON ROW inside group */
  .season-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    transition: background 0.12s;
  }
  .season-row:last-child { border-bottom: none; }
  .season-row:hover { background: var(--surface2); }

  .season-cover {
    width: 44px;
    height: 62px;
    object-fit: cover;
    border-radius: 5px;
    background: var(--surface3);
    flex-shrink: 0;
  }

  .season-info { flex: 1; min-width: 0; }

  .season-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
    white-space: normal;
    line-height: 1.3;
  }

  .season-submeta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 3px;
    flex-wrap: wrap;
  }

  /* STANDALONE ROW */
  .standalone-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    margin-bottom: 8px;
    transition: border-color 0.2s;
  }
  .standalone-row:hover { border-color: var(--border-hi); }

  .standalone-cover {
    width: 56px;
    height: 80px;
    object-fit: cover;
    border-radius: 6px;
    background: var(--surface3);
    flex-shrink: 0;
  }

  .standalone-info { flex: 1; min-width: 0; }
  .standalone-title {
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.3;
    color: var(--text);
  }
  .standalone-meta {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 4px;
    flex-wrap: wrap;
  }

  /* STATUS BADGES */
  .status-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 8px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .status-CURRENT   { background: rgba(130,212,160,0.15); color: var(--green); }
  .status-COMPLETED { background: rgba(144,188,216,0.15); color: var(--blue); }
  .status-PLANNING  { background: rgba(240,168,152,0.15); color: var(--accent); }
  .status-DROPPED   { background: rgba(232,120,120,0.15); color: var(--red); }
  .status-PAUSED    { background: rgba(240,200,120,0.15); color: var(--yellow); }

  .progress-text {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 500;
  }

  /* PROGRESS BAR */
  .progress-bar-wrap {
    width: 100%;
    height: 3px;
    background: var(--surface3);
    border-radius: 2px;
    margin-top: 6px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.3s;
    opacity: 0.7;
  }

  /* SEASON/STANDALONE ACTIONS */
  .season-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .score-badge {
    background: var(--surface3);
    border: 1px solid var(--border);
    border-radius: var(--radius-xs);
    color: var(--yellow);
    font-size: 12px;
    font-weight: 700;
    padding: 3px 7px;
    min-width: 32px;
    text-align: center;
  }
  .score-badge.no-score { color: var(--text-muted); font-weight: 400; }

  .btn-plus {
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    border-radius: var(--radius-xs);
    color: var(--accent);
    cursor: pointer;
    font-size: 15px;
    font-weight: 700;
    width: 28px;
    height: 28px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.12s;
    flex-shrink: 0;
  }
  .btn-plus:hover { background: var(--accent); color: #1a0e0a; }
  .btn-plus:active { transform: scale(0.92); }

  .btn-sm {
    background: var(--surface3);
    border: 1px solid var(--border);
    border-radius: var(--radius-xs);
    color: var(--text-muted);
    cursor: pointer;
    font-size: 13px;
    padding: 4px 8px;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.12s;
    white-space: nowrap;
  }
  .btn-sm:hover { color: var(--text-dim); border-color: var(--border-hi); }

  /* ── MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,8,6,0.75);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
    backdrop-filter: blur(3px);
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border-hi);
    border-radius: 18px;
    width: 100%;
    max-width: 460px;
    max-height: 90vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    box-shadow: 0 24px 60px rgba(0,0,0,0.6);
  }

  .modal-header {
    padding: 18px 18px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }

  .modal-cover {
    width: 48px;
    height: 68px;
    object-fit: cover;
    border-radius: 6px;
    background: var(--surface3);
    flex-shrink: 0;
  }

  .modal-title-wrap { flex: 1; min-width: 0; }
  .modal-title {
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    font-weight: 800;
    line-height: 1.3;
    color: var(--text);
  }
  .modal-subtitle {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 3px;
  }

  .btn-close {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 50%;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 14px;
    width: 26px;
    height: 26px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.12s;
  }
  .btn-close:hover { color: var(--text); border-color: var(--border-hi); }

  .modal-body { padding: 18px; display: flex; flex-direction: column; gap: 16px; }

  .field-group { display: flex; flex-direction: column; gap: 7px; }
  .field-label {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }

  .score-row {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
  }

  .score-btn {
    width: 36px;
    height: 36px;
    border-radius: var(--radius-xs);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.12s;
    font-family: 'DM Sans', sans-serif;
  }
  .score-btn:hover { border-color: var(--accent); color: var(--accent); }
  .score-btn.active { background: var(--accent); border-color: var(--accent); color: #1a0e0a; }

  .status-row {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
  }

  .status-btn {
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.12s;
    font-family: 'DM Sans', sans-serif;
  }
  .status-btn.active-CURRENT   { background: rgba(130,212,160,0.15); border-color: var(--green); color: var(--green); }

  .progress-row {

  }
  .progress-row input[type=number] {
    background: var(--surface2);
    border: 1px solid var(--border);

    font-family: 'DM Sans', sans-serif;

  .btn-cancel:hover { border-color: var(--border-hi); }

  /* LOADING */
  .loading {
    display: flex;

  .spinner {

  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-state {
    text-align: center;

  .empty-state .icon { font-size: 36px; opacity: 0.4; }

  /* TOAST */
  #toast {
    position: fixed;
    bottom: 22px;

    background: var(--surface2);

</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-logo">
    Neco<span>Track</span>
    <small>your anime, your way</small>
  </div>
  <div class="auth-card">
    <h2>Sign in with AniList</h2>
    <p>Connect your AniList account to load and sync your list. Your token is stored only in this browser.</p>
    <button class="btn-primary" onclick="startOAuth()">Continue with AniList</button>
    <div class="divider">or paste a token manually</div>
    <div class="token-input-wrap">
      <label>Access Token</label>
      <input type="password" id="manual-token" placeholder="paste token here…">
    </div>
    <button class="btn-primary" onclick="loginWithToken()">Sign in</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="header-logo">Neco<span>Track</span></div>
    <div class="header-right">
      <div class="user-chip" id="user-chip">
        <img src="" alt="" class="user-avatar" id="user-avatar">
        <span id="user-name">—</span>
      </div>
      <button class="btn-icon" onclick="loadList()" title="Refresh">↻</button>
      <button class="btn-icon" onclick="logout()">Sign out</button>

  </header>

  <div class="tabs-wrap">
    <div class="tabs">
      <button class="tab active" onclick="setTab('CURRENT',this)">Watching</button>
      <button class="tab" onclick="setTab('ALL',this)">All</button>
      <button class="tab" onclick="setTab('COMPLETED',this)">Completed</button>
      <button class="tab" onclick="setTab('PLANNING',this)">Planning</button>
      <button class="tab" onclick="setTab('PAUSED',this)">On hold</button>
      <button class="tab" onclick="setTab('DROPPED',this)">Dropped</button>
    </div>
  </div>

  <div class="controls">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input type="text" id="search-input" placeholder="Search your list…" oninput="onSearchInput(this.value)">
      <div id="catalog-results" class="catalog-dropdown" style="display:none"></div>
    </div>
    <select class="filter-select" id="sort-select" onchange="renderList()">
      <option value="title">By title</option>
      <option value="score">By score</option>
      <option value="progress">By progress</option>
      <option value="updated">By date added</option>
      <option value="year">By year</option>
    </select>
    <div class="toggle-group">
      <button class="toggle-btn active" id="toggle-group" onclick="toggleGrouping(true)">Group</button>
      <button class="toggle-btn" id="toggle-flat" onclick="toggleGrouping(false)">Flat</button>
    </div>
  </div>

  <main>
    <div class="stats-bar" id="stats-bar"></div>
    <div id="list-container"></div>
  </main>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <div class="modal-header">
      <img src="" class="modal-cover" id="modal-cover">
      <div class="modal-title-wrap">
        <div class="modal-title" id="modal-title">—</div>
        <div class="modal-subtitle" id="modal-subtitle">—</div>
      </div>
      <button class="btn-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="field-group">
        <div class="field-label">Status</div>
        <div class="status-row">
          <button class="status-btn" data-status="CURRENT"   onclick="setModalStatus('CURRENT')">Watching</button>
          <button class="status-btn" data-status="COMPLETED" onclick="setModalStatus('COMPLETED')">Completed</button>
          <button class="status-btn" data-status="PLANNING"  onclick="setModalStatus('PLANNING')">Planning</button>
          <button class="status-btn" data-status="PAUSED"    onclick="setModalStatus('PAUSED')">On hold</button>
          <button class="status-btn" data-status="DROPPED"   onclick="setModalStatus('DROPPED')">Dropped</button>
        </div>
      </div>
      <div class="field-group">
        <div class="field-label">Score</div>
        <div class="score-row" id="score-row"></div>
      </div>
      <div class="field-group">
        <div class="field-label">Progress</div>
        <div class="progress-row">
          <button class="btn-prog" onclick="adjustProgress(-1)">−</button>
          <input type="number" id="modal-progress" min="0" value="0">
          <span>/ <span id="modal-total">?</span> ep</span>
          <button class="btn-prog" onclick="adjustProgress(1)">+</button>
        </div>
      </div>
      <div class="field-group">
        <div class="field-label">Notes</div>
        <textarea class="notes-input" id="modal-notes" placeholder="Your personal notes…"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveEntry()">Save</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const CLIENT_ID = '43448';
const REDIRECT_URI = window.location.href.split('?')[0].split('#')[0];

let token = null;
let currentUser = null;
let allEntries = [];
let currentTab = 'CURRENT';
let groupingEnabled = true;
let editingEntry = null;
let modalScore = 0;
let modalStatus = '';

// ── AUTH ──
function startOAuth() {
  const url = `https://anilist.co/api/v2/oauth/authorize?client_id=${CLIENT_ID}&response_type=token`;
  window.location.href = url;
}

function loginWithToken() {
  const t = document.getElementById('manual-token').value.trim();
  if (!t) { showToast('Please enter a token'); return; }
  token = t;
  localStorage.setItem('al_token', t);
  initApp();
}

function logout() {
  localStorage.removeItem('al_token');
  token = null;
  allEntries = [];
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

function parseTokenFromHash() {
  const hash = window.location.hash;
  if (!hash) return null;
  const params = new URLSearchParams(hash.substring(1));
  return params.get('access_token');
}

// ── GRAPHQL ──
async function gql(query, variables = {}) {
  const res = await fetch('https://graphql.anilist.co', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${token}`
    },
    body: JSON.stringify({ query, variables })
  });
  const data = await res.json();
  if (data.errors) throw new Error(data.errors[0].message);
  return data.data;
}

async function fetchUser() {
  const data = await gql(`query { Viewer { id name avatar { medium } } }`);
  return data.Viewer;
}

async function fetchList(userId) {
  const data = await gql(`
    query($userId: Int) {
      MediaListCollection(userId: $userId, type: ANIME) {
        lists {
          entries {
            id
            status
            score(format: POINT_10)
            progress
            notes
            updatedAt
            media {
              id
              title { romaji english }
              coverImage { medium large }
              episodes
              season
              seasonYear
              relations {
                edges {
                  relationType(version: 2)
                  node { id type }
                }
              }
            }
          }
        }
      }
    }
  `, { userId });
  const entries = [];
  for (const list of data.MediaListCollection.lists) {
    for (const e of list.entries) entries.push(e);
  }
  return entries;
}

async function updateEntry(listId, status, score, progress, notes) {
  return gql(`
    mutation($id: Int, $status: MediaListStatus, $score: Float, $progress: Int, $notes: String) {
      SaveMediaListEntry(id: $id, status: $status, score: $score, progress: $progress, notes: $notes) {
        id status score progress notes
      }
    }
  `, { id: listId, status, score, progress, notes });
}

// ── GROUPING ──
function buildSeriesGroups(entries) {
  const byId = {};
  for (const e of entries) byId[e.media.id] = e;

  const parent = {};
  function find(x) {
    if (parent[x] === undefined) parent[x] = x;
    if (parent[x] !== x) parent[x] = find(parent[x]);
    return parent[x];
  }
  function union(a, b) {
    a = find(a); b = find(b);
    if (a !== b) parent[b] = a;
  }

  for (const e of entries) {
    const id = e.media.id;
    for (const edge of e.media.relations.edges) {
      if (['SEQUEL','PREQUEL'].includes(edge.relationType) && edge.node.type === 'ANIME') {
        if (byId[edge.node.id]) union(id, edge.node.id);
      }
    }
  }

  const groups = {};
  for (const e of entries) {
    const root = find(e.media.id);
    if (!groups[root]) groups[root] = [];
    groups[root].push(e);
  }

  return Object.values(groups).map(g => {
    g.sort((a, b) => (a.media.seasonYear || 9999) - (b.media.seasonYear || 9999));
    return g;
  });
}

// ── RENDER HELPERS ──
function statusLabel(s) {
  return { CURRENT:'Watching', COMPLETED:'Completed', PLANNING:'Planning', PAUSED:'On hold', DROPPED:'Dropped' }[s] || s;
}

function getTitle(media) {
  return media.title.english || media.title.romaji;
}

function getSeriesTitle(group) {
  const t = getTitle(group[0].media);
  return t.replace(/\s+(Season\s+\d+|S\d+|\d+(st|nd|rd|th)\s+Season)$/i,'').trim() || t;
}

function normalize(s) {
  return s.toLowerCase().replace(/[^\w\s]/g,'').replace(/\s+/g,' ').trim();
}

function fuzzyMatch(query, target) {
  if (!target) return false;
  const q = normalize(query), t = normalize(target);
  if (t.includes(q)) return true;
  return q.split(' ').filter(Boolean).every(tok => t.includes(tok));
}

// ── CATALOG SEARCH ──
let catalogTimer = null;
let lastCatalogQuery = '';

function onSearchInput(val) {
  renderList();
  const v = val.trim();
  if (v.length < 2) { closeCatalog(); return; }
  clearTimeout(catalogTimer);
  catalogTimer = setTimeout(() => searchCatalog(v), 400);
}

async function searchCatalog(query) {
  if (query === lastCatalogQuery) return;
  lastCatalogQuery = query;
  const drop = document.getElementById('catalog-results');
  drop.style.display = 'block';
  drop.innerHTML = `<div class="catalog-loading">Searching…</div>`;
  try {
    const data = await gql(`
      query($search: String) {
        Page(perPage: 8) {
          media(search: $search, type: ANIME, sort: SEARCH_MATCH) {
            id
            title { romaji english }
            coverImage { medium }
            episodes
            seasonYear
            format
          }
        }
      }
    `, { search: query });
    const results = data.Page.media;
    if (!results.length) { drop.innerHTML = `<div class="catalog-loading">Nothing found</div>`; return; }
    const listIds = new Set(allEntries.map(e => e.media.id));
    let html = `<div class="search-mode-hint"><span>AniList catalog results</span><button onclick="closeCatalog()">✕</button></div>`;
    for (const m of results) {
      const title = m.title.english || m.title.romaji;
      const inList = listIds.has(m.id);
      const meta = [m.format, m.episodes ? m.episodes+' ep' : null, m.seasonYear].filter(Boolean).join(' · ');
      html += `
        <div class="catalog-item">
          <img src="${m.coverImage.medium}" class="catalog-cover" loading="lazy">
          <div class="catalog-info">
            <div class="catalog-title">${title}</div>
            <div class="catalog-meta">${meta}</div>
          </div>
          ${inList
            ? `<span class="catalog-add in-list">In list</span>`
            : `<button class="catalog-add" onclick="addToList(${m.id}, event)">+ Add</button>`
          }
        </div>
      `;
    }
    drop.innerHTML = html;
  } catch(e) {
    drop.innerHTML = `<div class="catalog-loading">Error: ${e.message}</div>`;
  }
}

function closeCatalog() {
  lastCatalogQuery = '';
  const drop = document.getElementById('catalog-results');
  drop.style.display = 'none';
  drop.innerHTML = '';
}

async function addToList(mediaId, event) {
  const btn = event.target;
  btn.textContent = '…';
  btn.disabled = true;
  try {
    const data = await gql(`
      mutation($mediaId: Int, $status: MediaListStatus) {
        SaveMediaListEntry(mediaId: $mediaId, status: $status) {
          id status score progress notes updatedAt
          media {
            id title { romaji english } coverImage { medium large }
            episodes season seasonYear
            relations { edges { relationType(version: 2) node { id type } } }
          }
        }
      }
    `, { mediaId, status: 'PLANNING' });
    const entry = data.SaveMediaListEntry;
    allEntries.push(entry);
    btn.textContent = 'In list';
    btn.classList.add('in-list');
    btn.disabled = true;
    showToast('Added to planning');
    renderList();
  } catch(e) {
    btn.textContent = '+ Add';
    btn.disabled = false;
    showToast('Error: ' + e.message);
  }
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-wrap')) closeCatalog();
});

// ── RENDER ──
function renderList() {
  const container = document.getElementById('list-container');
  const search = (document.getElementById('search-input').value || '').toLowerCase().trim();
  const sort = document.getElementById('sort-select').value;

  let filtered = currentTab === 'ALL'
    ? [...allEntries]
    : allEntries.filter(e => e.status === currentTab);

  if (search) {
    filtered = filtered.filter(e => fuzzyMatch(search, getTitle(e.media)) || fuzzyMatch(search, e.media.title.romaji || ''));
  }

  renderStats(filtered);

  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="icon">📋</div><div>Nothing here yet</div></div>`;
    return;
  }

  if (groupingEnabled) renderGrouped(filtered, sort, container);
  else renderFlat(filtered, sort, container);
}

function renderStats(entries) {
  const bar = document.getElementById('stats-bar');
  const total = entries.length;
  const scored = entries.filter(e => e.score > 0);
  const avgScore = scored.length ? (scored.reduce((s,e)=>s+e.score,0)/scored.length).toFixed(1) : '—';
  const eps = entries.reduce((s,e)=>s+(e.progress||0),0);
  bar.innerHTML = `
    <div class="stat-chip"><strong>${total}</strong> anime</div>
    <div class="stat-chip"><strong>${avgScore}</strong> avg score</div>
    <div class="stat-chip"><strong>${eps}</strong> episodes watched</div>
  `;
}

function sortEntries(entries, sort) {
  return [...entries].sort((a, b) => {
    if (sort === 'title')    return getTitle(a.media).localeCompare(getTitle(b.media));
    if (sort === 'score')    return (b.score||0) - (a.score||0);
    if (sort === 'progress') return (b.progress||0) - (a.progress||0);
    if (sort === 'updated')  return (b.updatedAt||0) - (a.updatedAt||0);
    if (sort === 'year')     return (b.media.seasonYear||0) - (a.media.seasonYear||0);
    return 0;
  });
}

function renderGrouped(entries, sort, container) {
  const groups = buildSeriesGroups(entries);

  groups.sort((ga, gb) => {
    const sort_ = document.getElementById('sort-select').value;
    if (sort_ === 'title') return getSeriesTitle(ga).localeCompare(getSeriesTitle(gb));
    if (sort_ === 'score') {
      const avgA = ga.filter(e=>e.score>0).reduce((s,e)=>s+e.score,0) / (ga.filter(e=>e.score>0).length||1);
      const avgB = gb.filter(e=>e.score>0).reduce((s,e)=>s+e.score,0) / (gb.filter(e=>e.score>0).length||1);
      return avgB - avgA;
    }
    if (sort_ === 'updated') return (gb[gb.length-1].updatedAt||0) - (ga[ga.length-1].updatedAt||0);
    if (sort_ === 'year') return (gb[0].media.seasonYear||0) - (ga[0].media.seasonYear||0);
    return 0;
  });

  let html = '<div class="anime-list">';
  for (const group of groups) {
    const isMulti = group.length > 1;
    const rep = group[0];
    const seriesTitle = getSeriesTitle(group);
    const cover = rep.media.coverImage.medium;
    const scored = group.filter(e=>e.score>0);
    const avgScore = scored.length ? (scored.reduce((s,e)=>s+e.score,0)/scored.length).toFixed(1) : null;
    const groupId = 'g_' + rep.media.id;

    if (isMulti) {
      html += `
        <div class="series-group" id="${groupId}">
          <div class="series-header" onclick="toggleGroup('${groupId}')">
            <img src="${cover}" class="series-cover" loading="lazy">
            <div class="series-info">
              <div class="series-title">${seriesTitle}</div>
              <div class="series-meta">
                <span class="season-count">${group.length} seasons</span>
                ${avgScore ? `<span class="series-score-avg">★ ${avgScore}</span>` : ''}
              </div>
            </div>
            <span class="chevron">▶</span>
          </div>
          <div class="seasons-list" style="display:none">
      `;
      for (const entry of group) html += seasonRowHTML(entry);
      html += `</div></div>`;
    } else {
      html += standaloneRowHTML(rep);
    }
  }
  html += '</div>';
  container.innerHTML = html;
}

function renderFlat(entries, sort, container) {
  const sorted = sortEntries(entries, sort);
  let html = '<div class="anime-list">';
  for (const entry of sorted) html += standaloneRowHTML(entry);
  html += '</div>';
  container.innerHTML = html;
}

function progressBar(prog, eps) {
  if (!eps) return '';
  const pct = Math.min(100, Math.round((prog / eps) * 100));
  return `<div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>`;
}

function seasonRowHTML(entry) {
  const title = getTitle(entry.media);
  const eps = entry.media.episodes;
  const prog = entry.progress || 0;
  const cover = entry.media.coverImage.medium;
  const scoreStr = entry.score > 0 ? entry.score : '—';
  const scoreClass = entry.score > 0 ? '' : 'no-score';
  const isDone = eps && prog >= eps;
  const plusBtn = isDone ? '' : `<button class="btn-plus" onclick='quickPlus(${entry.id})' title="+1 episode">+</button>`;
  return `
    <div class="season-row">
      <img src="${cover}" class="season-cover" loading="lazy">
      <div class="season-info">
        <div class="season-title">${title}</div>
        <div class="season-submeta">
          <span class="status-badge status-${entry.status}">${statusLabel(entry.status)}</span>
          <span class="progress-text">${prog}${eps ? '/'+eps : ''} ep</span>
          ${entry.notes ? `<span style="font-size:11px;color:var(--text-muted)" title="${entry.notes}">📝</span>` : ''}
        </div>
        ${progressBar(prog, eps)}
      </div>
      <div class="season-actions">
        <span class="score-badge ${scoreClass}">${scoreStr}</span>
        ${plusBtn}
        <button class="btn-sm btn-edit" onclick='openModal(${JSON.stringify(entry).replace(/'/g,"&#39;")})'>✎</button>
      </div>
    </div>
  `;
}

function standaloneRowHTML(entry) {
  const title = getTitle(entry.media);
  const eps = entry.media.episodes;
  const prog = entry.progress || 0;
  const cover = entry.media.coverImage.medium;
  const scoreStr = entry.score > 0 ? entry.score : '—';
  const scoreClass = entry.score > 0 ? '' : 'no-score';
  const isDone = eps && prog >= eps;
  const plusBtn = isDone ? '' : `<button class="btn-plus" onclick='quickPlus(${entry.id})' title="+1 episode">+</button>`;
  return `
    <div class="standalone-row">
      <img src="${cover}" class="standalone-cover" loading="lazy">
      <div class="standalone-info">
        <div class="standalone-title">${title}</div>
        <div class="standalone-meta">
          <span class="status-badge status-${entry.status}">${statusLabel(entry.status)}</span>
          <span class="progress-text">${prog}${eps ? '/'+eps : ''} ep</span>
          ${entry.notes ? `<span style="font-size:11px;color:var(--text-muted)" title="${entry.notes}">📝</span>` : ''}
        </div>
        ${progressBar(prog, eps)}
      </div>
      <div class="season-actions">
        <span class="score-badge ${scoreClass}">${scoreStr}</span>
        ${plusBtn}
        <button class="btn-sm btn-edit" onclick='openModal(${JSON.stringify(entry).replace(/'/g,"&#39;")})'>✎</button>
      </div>
    </div>
  `;
}

function toggleGroup(id) {
  const el = document.getElementById(id);
  const sl = el.querySelector('.seasons-list');
  el.classList.toggle('open');
  sl.style.display = el.classList.contains('open') ? 'block' : 'none';
}

// ── QUICK +1 ──
async function quickPlus(entryId) {
  const entry = allEntries.find(e => e.id === entryId);
  if (!entry) return;
  const total = entry.media.episodes || 99999;
  const newProg = Math.min((entry.progress || 0) + 1, total);
  try {
    await updateEntry(entry.id, entry.status, entry.score, newProg, entry.notes);
    entry.progress = newProg;
    if (entry.media.episodes && newProg >= entry.media.episodes && entry.status === 'CURRENT') {
      entry.status = 'COMPLETED';
      await updateEntry(entry.id, 'COMPLETED', entry.score, newProg, entry.notes);
      showToast('Completed! 🎉');
    } else {
      showToast(`${newProg}${entry.media.episodes ? '/'+entry.media.episodes : ''} episodes`);
    }
    renderList();
  } catch(e) {
    showToast('Error: ' + e.message);
  }
}

// ── TABS ──
function setTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

function toggleGrouping(enabled) {
  groupingEnabled = enabled;
  document.getElementById('toggle-group').classList.toggle('active', enabled);
  document.getElementById('toggle-flat').classList.toggle('active', !enabled);
  renderList();
}

// ── MODAL ──
function openModal(entryJson) {
  const entry = typeof entryJson === 'string' ? JSON.parse(entryJson) : entryJson;
  editingEntry = entry;
  modalScore = entry.score || 0;
  modalStatus = entry.status;

  document.getElementById('modal-cover').src = entry.media.coverImage.large || entry.media.coverImage.medium;
  document.getElementById('modal-title').textContent = getTitle(entry.media);
  document.getElementById('modal-subtitle').textContent =
    (entry.media.season || '') + (entry.media.seasonYear ? ' ' + entry.media.seasonYear : '');
  document.getElementById('modal-progress').value = entry.progress || 0;
  document.getElementById('modal-total').textContent = entry.media.episodes || '?';
  document.getElementById('modal-notes').value = entry.notes || '';

  const sr = document.getElementById('score-row');
  sr.innerHTML = '';
  for (let i = 1; i <= 10; i++) {
    const btn = document.createElement('button');
    btn.className = 'score-btn' + (i === modalScore ? ' active' : '');
    btn.textContent = i;
    btn.onclick = () => { modalScore = i; sr.querySelectorAll('.score-btn').forEach((b,j)=>b.classList.toggle('active',j+1===i)); };
    sr.appendChild(btn);
  }

  document.querySelectorAll('.status-btn').forEach(b => {
    b.className = 'status-btn';
    if (b.dataset.status === modalStatus) b.classList.add('active-' + modalStatus);
  });

  document.getElementById('edit-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('edit-modal').classList.remove('open');
  editingEntry = null;
}

function setModalStatus(s) {
  modalStatus = s;
  document.querySelectorAll('.status-btn').forEach(b => {
    b.className = 'status-btn';
    if (b.dataset.status === s) b.classList.add('active-' + s);
  });
}

function adjustProgress(delta) {
  const inp = document.getElementById('modal-progress');
  const val = parseInt(inp.value) || 0;
  const total = editingEntry?.media?.episodes || 99999;
  inp.value = Math.max(0, Math.min(total, val + delta));
}

async function saveEntry() {
  if (!editingEntry) return;
  const progress = parseInt(document.getElementById('modal-progress').value) || 0;
  const notes = document.getElementById('modal-notes').value;
  try {
    await updateEntry(editingEntry.id, modalStatus, modalScore, progress, notes);
    const idx = allEntries.findIndex(e => e.id === editingEntry.id);
    if (idx >= 0) {
      allEntries[idx].score = modalScore;
      allEntries[idx].status = modalStatus;
      allEntries[idx].progress = progress;
      allEntries[idx].notes = notes;
    }
    closeModal();
    renderList();
    showToast('Saved ✓');
  } catch(e) {
    showToast('Error: ' + e.message);
  }
}

// ── INIT ──
async function initApp() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('app').style.flexDirection = 'column';
  document.getElementById('list-container').innerHTML = `<div class="loading"><div class="spinner"></div><div>Loading your list…</div></div>`;

  try {
    currentUser = await fetchUser();
    document.getElementById('user-name').textContent = currentUser.name;
    if (currentUser.avatar?.medium) {
      document.getElementById('user-avatar').src = currentUser.avatar.medium;
    }
    await loadList();
  } catch(e) {
    document.getElementById('list-container').innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><div>Error: ${e.message}</div></div>`;
  }
}

async function loadList() {
  document.getElementById('list-container').innerHTML = `<div class="loading"><div class="spinner"></div><div>Loading your list…</div></div>`;
  try {
    allEntries = await fetchList(currentUser.id);
    renderList();
  } catch(e) {
    document.getElementById('list-container').innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><div>Failed to load: ${e.message}</div></div>`;
  }
}

// ── TOAST ──
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ── STARTUP ──
(function() {
  const hashToken = parseTokenFromHash();
  if (hashToken) {
    token = hashToken;
    localStorage.setItem('al_token', hashToken);
    window.history.replaceState({}, '', window.location.pathname);
    initApp();
    return;
  }
  const saved = localStorage.getItem('al_token');
  if (saved) {
    token = saved;
    initApp();
    return;
  }
  document.getElementById('auth-screen').style.display = 'flex';
})();

// ── PWA ──
(function() {
  function makeIcon(size) {
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');

    const grad = ctx.createLinearGradient(0, 0, size, size);
    grad.addColorStop(0, '#231a12');
    grad.addColorStop(1, '#151210');
    ctx.fillStyle = grad;
    const r = size * 0.18;
    ctx.beginPath();
    ctx.moveTo(r, 0); ctx.lineTo(size-r, 0);
    ctx.quadraticCurveTo(size,0,size,r);
    ctx.lineTo(size,size-r);
    ctx.quadraticCurveTo(size,size,size-r,size);
    ctx.lineTo(r,size);
    ctx.quadraticCurveTo(0,size,0,size-r);
    ctx.lineTo(0,r);
    ctx.quadraticCurveTo(0,0,r,0);
    ctx.closePath();
    ctx.fill();

    const glow = ctx.createRadialGradient(size*0.5,size*0.42,0,size*0.5,size*0.42,size*0.38);
    glow.addColorStop(0,'rgba(240,168,152,0.18)');
    glow.addColorStop(1,'rgba(240,168,152,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0,0,size,size);

    const earW = size*0.13, earH = size*0.16, earY = size*0.18;
    ctx.fillStyle = '#f0a898';
    ctx.beginPath();
    ctx.moveTo(size*0.26, earY+earH); ctx.lineTo(size*0.26+earW*0.5, earY); ctx.lineTo(size*0.26+earW, earY+earH);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(size*0.74-earW, earY+earH); ctx.lineTo(size*0.74-earW*0.5, earY); ctx.lineTo(size*0.74, earY+earH);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = 'rgba(255,202,188,0.5)';
    ctx.beginPath();
    ctx.moveTo(size*0.26+earW*0.25, earY+earH-earH*0.1); ctx.lineTo(size*0.26+earW*0.5, earY+earH*0.3); ctx.lineTo(size*0.26+earW*0.75, earY+earH-earH*0.1);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(size*0.74-earW*0.75, earY+earH-earH*0.1); ctx.lineTo(size*0.74-earW*0.5, earY+earH*0.3); ctx.lineTo(size*0.74-earW*0.25, earY+earH-earH*0.1);
    ctx.closePath(); ctx.fill();

    ctx.font = `800 ${size*0.3}px "Nunito", sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#9e8e82';
    ctx.fillText('N', size*0.36, size*0.62);
    ctx.fillStyle = '#f0a898';
    ctx.fillText('T', size*0.64, size*0.62);

    ctx.strokeStyle = '#f0a898';
    ctx.lineWidth = size*0.025; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(size*0.35, size*0.78); ctx.lineTo(size*0.65, size*0.78);
    ctx.stroke();

    return canvas.toDataURL('image/png');
  }

  const icon192 = makeIcon(192);
  const icon512 = makeIcon(512);
  document.getElementById('apple-icon').href = icon512;

  const manifest = {
    name: 'NecoTrack', short_name: 'NecoTrack',
    start_url: window.location.pathname,
    display: 'standalone',
    background_color: '#151210', theme_color: '#1e1a16',
    orientation: 'portrait',
    icons: [
      { src: icon192, sizes: '192x192', type: 'image/png' },
      { src: icon512, sizes: '512x512', type: 'image/png' }
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
  document.getElementById('manifest-link').href = URL.createObjectURL(blob);

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => { for (const r of regs) r.unregister(); });
    navigator.serviceWorker.addEventListener('controllerchange', () => window.location.reload());
  }
})();
</script>

<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NecoTrack</title>

<!-- PWA -->
<meta name="theme-color" content="#0d0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NecoTrack">
<link rel="apple-touch-icon" href="#" id="apple-icon">
<link rel="manifest" href="#" id="manifest-link">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap');

  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --surface2: #1e1e24;
    --surface3: #26262e;
    --border: #2a2a34;
    --accent: #7c6af7;
    --accent-dim: rgba(124,106,247,0.15);
    --accent-hover: #9585ff;
    --text: #e8e8f0;
    --text-dim: #8888a0;
    --text-muted: #55556a;
    --green: #4ade80;
    --yellow: #fbbf24;
    --red: #f87171;
    --blue: #60a5fa;
    --radius: 10px;
    --radius-sm: 6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
  }

  /* ── AUTH SCREEN ── */
  #auth-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    gap: 32px;
  }

  .auth-logo {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 36px;
    font-weight: 700;
    letter-spacing: -1px;
    color: var(--text);
  }
  .auth-logo span { color: var(--accent); }

  .auth-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px;
    max-width: 400px;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: center;
    text-align: center;
  }

  .auth-card h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px;
    font-weight: 600;
  }

  .auth-card p {
    color: var(--text-dim);
    font-size: 13px;
    line-height: 1.6;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 12px 28px;
    border-radius: var(--radius-sm);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    width: 100%;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:active { transform: scale(0.98); }

  .token-input-wrap {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .token-input-wrap label {
    font-size: 12px;
    color: var(--text-dim);
    text-align: left;
  }
  .token-input-wrap input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 10px 14px;
    width: 100%;
    outline: none;
    transition: border-color 0.15s;
  }
  .token-input-wrap input:focus { border-color: var(--accent); }

  .divider {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--text-muted);
    font-size: 12px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── APP LAYOUT ── */
  #app { display: none; flex-direction: column; min-height: 100vh; }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-logo {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .header-logo span { color: var(--accent); }

  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .user-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px 4px 4px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
  }

  .user-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--surface3);
  }

  .btn-icon {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-dim);
    cursor: pointer;
    padding: 6px 10px;
    font-size: 13px;
    transition: color 0.15s, border-color 0.15s;
  }
  .btn-icon:hover { color: var(--text); border-color: var(--accent); }

  /* ── TABS ── */
  .tabs-wrap {
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    overflow-y: visible;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    position: sticky;
    top: 56px;
    z-index: 90;
  }
  .tabs-wrap::-webkit-scrollbar { display: none; }

  .tabs {
    display: flex;
    gap: 0;
    padding: 12px 16px 0;
    min-width: max-content;
  }

  .tab {
    padding: 8px 18px;
    border-radius: var(--radius-sm) var(--radius-sm) 0 0;
    border: 1px solid transparent;
    border-bottom: none;
    background: transparent;
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: color 0.15s, background 0.15s;
    font-family: 'Inter', sans-serif;
    white-space: nowrap;
  }
  .tab.active {
    background: var(--surface);
    border-color: var(--border);
    color: var(--text);
  }
  .tab:not(.active):hover { color: var(--text); }

  /* ── CONTROLS ── */
  .controls {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
    max-width: 400px;
  }
  .search-wrap input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 8px 12px 8px 34px;
    width: 100%;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 14px;
    pointer-events: none;
  }

  .catalog-dropdown {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    z-index: 200;
    max-height: 360px;
    overflow-y: auto;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }

  .catalog-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  .catalog-item:last-child { border-bottom: none; }
  .catalog-item:hover { background: var(--surface2); }

  .catalog-cover {
    width: 30px;
    height: 42px;
    object-fit: cover;
    border-radius: 3px;
    background: var(--surface3);
    flex-shrink: 0;
  }

  .catalog-info { flex: 1; min-width: 0; }
  .catalog-title {
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .catalog-meta {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .catalog-add {
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    border-radius: var(--radius-sm);
    color: var(--accent);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    cursor: pointer;
    white-space: nowrap;
    font-family: 'Inter', sans-serif;
    transition: background 0.12s;
    flex-shrink: 0;
  }
  .catalog-add:hover { background: var(--accent); color: #fff; }
  .catalog-add.in-list { background: transparent; border-color: var(--border); color: var(--text-muted); cursor: default; }

  .catalog-loading {
    padding: 16px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
  }

  .search-mode-hint {
    font-size: 10px;
    color: var(--text-muted);
    padding: 8px 12px 4px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .search-mode-hint button {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 10px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    padding: 0;
  }

  select.filter-select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 8px 12px;
    outline: none;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  select.filter-select:focus { border-color: var(--accent); }

  .toggle-group {
    display: flex;
    gap: 2px;
    margin-left: auto;
  }
  .toggle-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 12px;
    padding: 7px 10px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: all 0.15s;
  }
  .toggle-btn:first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
  .toggle-btn:last-child { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
  .toggle-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

  /* ── CONTENT ── */
  main {
    padding: 20px 24px;
    flex: 1;
  }

  .stats-bar {
    display: flex;
    gap: 16px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .stat-chip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .stat-chip strong { color: var(--text); font-weight: 600; margin-right: 4px; }

  /* ── LIST ── */
  .anime-list { display: flex; flex-direction: column; gap: 2px; }

  /* Grouped series */
  .series-group {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 8px;
    transition: border-color 0.15s;
  }
  .series-group:hover { border-color: var(--accent); }

  .series-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    cursor: pointer;
    user-select: none;
  }

  .series-cover {
    width: 40px;
    height: 56px;
    object-fit: cover;
    border-radius: 4px;
    background: var(--surface3);
    flex-shrink: 0;
  }

  .series-info {
    flex: 1;
    min-width: 0;
  }

  .series-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }

  .series-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
    flex-wrap: wrap;
  }

  .season-count {
    font-size: 11px;
    color: var(--text-muted);
    background: var(--surface3);
    padding: 2px 8px;
    border-radius: 10px;
  }

  .series-score-avg {
    font-size: 12px;
    font-weight: 600;
    color: var(--yellow);
    display: flex;
    align-items: center;
    gap: 3px;
  }

  .chevron {
    color: var(--text-muted);
    font-size: 12px;
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .series-group.open .chevron { transform: rotate(90deg); }

  /* Single season rows */
  .seasons-list { border-top: 1px solid var(--border); }

  .season-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px 10px 66px;
    border-bottom: 1px solid var(--border);
    transition: background 0.12s;
  }
  .season-row:last-child { border-bottom: none; }
  .season-row:hover { background: var(--surface2); }

  .season-cover {
    width: 32px;
    height: 44px;
    object-fit: cover;
    border-radius: 3px;
    background: var(--surface3);
    flex-shrink: 0;
  }

  .season-info { flex: 1; min-width: 0; }

  .season-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .season-submeta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 3px;
    flex-wrap: wrap;
  }

  .status-badge {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 8px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .status-CURRENT { background: rgba(74,222,128,0.15); color: var(--green); }
  .status-COMPLETED { background: rgba(96,165,250,0.15); color: var(--blue); }
  .status-PLANNING { background: rgba(124,106,247,0.15); color: var(--accent); }
  .status-DROPPED { background: rgba(248,113,113,0.15); color: var(--red); }
  .status-PAUSED { background: rgba(251,191,36,0.15); color: var(--yellow); }

  .progress-text {
    font-size: 11px;
    color: var(--text-muted);
  }

  .season-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .score-badge {
    background: var(--surface3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--yellow);
    font-size: 12px;
    font-weight: 700;
    padding: 3px 8px;
    min-width: 36px;
    text-align: center;
  }
  .score-badge.no-score { color: var(--text-muted); font-weight: 400; }

  .btn-plus {
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    border-radius: var(--radius-sm);
    color: var(--accent);
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
    width: 30px;
    height: 30px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.12s;
    flex-shrink: 0;
  }
  .btn-plus:hover { background: var(--accent); color: #fff; }
  .btn-plus:active { transform: scale(0.93); }

  .btn-sm {
    background: var(--surface3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    cursor: pointer;
    font-size: 13px;
    padding: 4px 8px;
    font-family: 'Inter', sans-serif;
    transition: all 0.12s;
    white-space: nowrap;
  }
  .btn-sm:hover { color: var(--text-dim); }

  /* ── STANDALONE (ungrouped) row ── */
  .standalone-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    margin-bottom: 8px;
    transition: border-color 0.15s;
  }
  .standalone-row:hover { border-color: var(--accent); }

  .standalone-cover {
    width: 40px;
    height: 56px;
    object-fit: cover;
    border-radius: 4px;
    background: var(--surface3);
    flex-shrink: 0;
  }

  .standalone-info { flex: 1; min-width: 0; }
  .standalone-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .standalone-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
    flex-wrap: wrap;
  }

  /* ── MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 100%;
    max-width: 480px;
    max-height: 90vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .modal-header {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }

  .modal-cover {
    width: 52px;
    height: 72px;
    object-fit: cover;
    border-radius: 6px;
    background: var(--surface3);
    flex-shrink: 0;
  }

  .modal-title-wrap { flex: 1; min-width: 0; }
  .modal-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.3;
  }
  .modal-subtitle {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  .btn-close {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 18px;
    padding: 0;
    line-height: 1;
    flex-shrink: 0;
  }
  .btn-close:hover { color: var(--text); }

  .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }

  .field-group { display: flex; flex-direction: column; gap: 6px; }
  .field-label { font-size: 12px; color: var(--text-dim); font-weight: 500; }

  .score-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .score-btn {
    width: 38px;
    height: 38px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.12s;
    font-family: 'Inter', sans-serif;
  }
  .score-btn:hover { border-color: var(--accent); color: var(--accent); }
  .score-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .status-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .status-btn {
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.12s;
    font-family: 'Inter', sans-serif;
  }
  .status-btn.active-CURRENT { background: rgba(74,222,128,0.15); border-color: var(--green); color: var(--green); }
  .status-btn.active-COMPLETED { background: rgba(96,165,250,0.15); border-color: var(--blue); color: var(--blue); }
  .status-btn.active-PLANNING { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .status-btn.active-DROPPED { background: rgba(248,113,113,0.15); border-color: var(--red); color: var(--red); }
  .status-btn.active-PAUSED { background: rgba(251,191,36,0.15); border-color: var(--yellow); color: var(--yellow); }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .progress-row input[type=number] {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 8px 12px;
    width: 80px;
    outline: none;
    text-align: center;
    transition: border-color 0.15s;
  }
  .progress-row input:focus { border-color: var(--accent); }
  .progress-row span { color: var(--text-dim); font-size: 13px; }
  .btn-prog {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    cursor: pointer;
    font-size: 16px;
    width: 34px;
    height: 34px;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.15s;
  }
  .btn-prog:hover { border-color: var(--accent); }

  textarea.notes-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 10px 14px;
    width: 100%;
    resize: vertical;
    min-height: 80px;
    outline: none;
    transition: border-color 0.15s;

  .btn-cancel {

    border-radius: var(--radius-sm);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .btn-cancel:hover { border-color: var(--accent); }

  /* ── LOADING ── */

    display: flex;

    align-items: center;
    justify-content: center;
    padding: 80px 24px;
    gap: 16px;

  .spinner {

    border: 3px solid var(--border);
    border-top-color: var(--accent);

  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-state {
    text-align: center;
    padding: 60px 24px;

    flex-direction: column;
    align-items: center;

  /* ── TOAST ── */

    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface2);
    border: 1px solid var(--border);

    padding: 12px 18px;
    font-size: 13px;

    opacity: 0;
    transform: translateY(8px);
    transition: all 0.2s;
    z-index: 999;
    pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateY(0); }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {

    .tabs { padding-left: 16px; }

</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-logo">Neco<span>Track</span></div>
  <div class="auth-card">
    <h2>Увійти через AniList</h2>

  <div class="tabs-wrap">

  <main>

</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <div class="modal-header">
      <img src="" class="modal-cover" id="modal-cover">
      <div class="modal-title-wrap">

    </div>
    <div class="modal-body">
      <div class="field-group">
        <div class="field-label">Статус</div>
        <div class="status-row">
          <button class="status-btn" data-status="CURRENT" onclick="setModalStatus('CURRENT')">Дивлюся</button>
          <button class="status-btn" data-status="COMPLETED" onclick="setModalStatus('COMPLETED')">Переглянуто</button>
          <button class="status-btn" data-status="PLANNING" onclick="setModalStatus('PLANNING')">Заплановано</button>
          <button class="status-btn" data-status="PAUSED" onclick="setModalStatus('PAUSED')">Пауза</button>
          <button class="status-btn" data-status="DROPPED" onclick="setModalStatus('DROPPED')">Покинуто</button>
        </div>
      </div>
      <div class="field-group">
        <div class="field-label">Оцінка</div>

          <!-- filled by JS -->
        </div>

      <div class="field-group">
        <div class="field-label">Прогрес</div>
        <div class="progress-row">
          <button class="btn-prog" onclick="adjustProgress(-1)">−</button>
          <input type="number" id="modal-progress" min="0" value="0">

      <button class="btn-save" onclick="saveEntry()">Зберегти</button>

<div id="toast"></div>

<script>
const CLIENT_ID = '43448';
const REDIRECT_URI = window.location.href.split('?')[0].split('#')[0];
const GQL = 'https://api.anthropic.com/v1/messages';

let token = null;
let currentUser = null;
let allEntries = [];
let currentTab = 'CURRENT';
let groupingEnabled = true;
let editingEntry = null;
let modalScore = 0;
let modalStatus = '';

// ── AUTH ──
function startOAuth() {
  const url = `https://anilist.co/api/v2/oauth/authorize?client_id=${CLIENT_ID}&response_type=token`;
  window.location.href = url;
}

function loginWithToken() {
  const t = document.getElementById('manual-token').value.trim();
  if (!t) { showToast('Введи токен'); return; }
  token = t;
  localStorage.setItem('al_token', t);
  initApp();
}

function logout() {
  localStorage.removeItem('al_token');
  token = null;
  allEntries = [];
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

function parseTokenFromHash() {
  const hash = window.location.hash;
  if (!hash) return null;
  const params = new URLSearchParams(hash.substring(1));
  return params.get('access_token');
}

// ── GRAPHQL ──
async function gql(query, variables = {}) {
  const res = await fetch('https://graphql.anilist.co', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${token}`
    },
    body: JSON.stringify({ query, variables })
  });
  const data = await res.json();
  if (data.errors) throw new Error(data.errors[0].message);
  return data.data;
}

async function fetchUser() {
  const data = await gql(`query { Viewer { id name avatar { medium } } }`);
  return data.Viewer;
}

async function fetchList(userId) {
  const data = await gql(`
    query($userId: Int) {
      MediaListCollection(userId: $userId, type: ANIME) {
        lists {
          entries {
            id
            status
            score(format: POINT_10)
            progress
            notes
            updatedAt
            media {
              id
              title { romaji english }
              coverImage { medium large }
              episodes
              season
              seasonYear
              relations {
                edges {
                  relationType(version: 2)
                  node { id type }
                }
              }
            }
          }
        }
      }
    }
  `, { userId });
  const entries = [];
  for (const list of data.MediaListCollection.lists) {
    for (const e of list.entries) entries.push(e);
  }
  return entries;
}

async function updateEntry(listId, status, score, progress, notes) {
  return gql(`
    mutation($id: Int, $status: MediaListStatus, $score: Float, $progress: Int, $notes: String) {
      SaveMediaListEntry(id: $id, status: $status, score: $score, progress: $progress, notes: $notes) {
        id status score progress notes
      }
    }
  `, { id: listId, status, score, progress, notes });
}

// ── GROUPING LOGIC ──
function buildSeriesGroups(entries) {
  // Build a map: mediaId -> entry
  const byId = {};
  for (const e of entries) byId[e.media.id] = e;

  // Find connected components via SEQUEL/PREQUEL relations
  const parent = {};
  function find(x) {
    if (parent[x] === undefined) parent[x] = x;
    if (parent[x] !== x) parent[x] = find(parent[x]);
    return parent[x];
  }
  function union(a, b) {
    a = find(a); b = find(b);
    if (a !== b) parent[b] = a;
  }

  for (const e of entries) {
    const id = e.media.id;
    for (const edge of e.media.relations.edges) {
      if (['SEQUEL','PREQUEL'].includes(edge.relationType) && edge.node.type === 'ANIME') {
        if (byId[edge.node.id]) union(id, edge.node.id);
      }
    }
  }

  const groups = {};
  for (const e of entries) {
    const root = find(e.media.id);
    if (!groups[root]) groups[root] = [];
    groups[root].push(e);
  }

  return Object.values(groups).map(g => {
    // Sort seasons chronologically
    g.sort((a, b) => {
      const ay = a.media.seasonYear || 9999;
      const by = b.media.seasonYear || 9999;
      return ay - by;
    });
    return g;
  });
}

// ── RENDER ──
function statusLabel(s) {
  return {CURRENT:'Дивлюся',COMPLETED:'Переглянуто',PLANNING:'Заплановано',PAUSED:'Пауза',DROPPED:'Покинуто'}[s] || s;
}

function getTitle(media) {
  return media.title.english || media.title.romaji;
}

function getSeriesTitle(group) {
  // Use first season's title, stripping season suffix
  const t = getTitle(group[0].media);
  return t.replace(/\s+(Season\s+\d+|S\d+|\d+(st|nd|rd|th)\s+Season)$/i,'').trim() || t;
}

// ── FUZZY SEARCH ──
function normalize(s) {
  return s.toLowerCase()
    .replace(/[^\w\s]/g, '')        // strip punctuation
    .replace(/\s+/g, ' ')           // collapse spaces
    .trim();
}

function fuzzyMatch(query, target) {
  if (!target) return false;
  const q = normalize(query);
  const t = normalize(target);
  if (t.includes(q)) return true;
  // token-based: all query words present in target
  const qTokens = q.split(' ').filter(Boolean);
  return qTokens.every(tok => t.includes(tok));
}

// ── CATALOG SEARCH ──
let catalogTimer = null;
let lastCatalogQuery = '';

function onSearchInput(val) {
  renderList(); // always filter local list
  const v = val.trim();
  if (v.length < 2) {
    closeCatalog();
    return;
  }
  clearTimeout(catalogTimer);
  catalogTimer = setTimeout(() => searchCatalog(v), 400);
}

async function searchCatalog(query) {
  if (query === lastCatalogQuery) return;
  lastCatalogQuery = query;
  const drop = document.getElementById('catalog-results');
  drop.style.display = 'block';
  drop.innerHTML = `<div class="catalog-loading">Пошук...</div>`;
  try {
    const data = await gql(`
      query($search: String) {
        Page(perPage: 8) {
          media(search: $search, type: ANIME, sort: SEARCH_MATCH) {
            id
            title { romaji english }
            coverImage { medium }
            episodes
            seasonYear
            format
          }
        }
      }
    `, { search: query });
    const results = data.Page.media;
    if (!results.length) {
      drop.innerHTML = `<div class="catalog-loading">Нічого не знайдено</div>`;
      return;
    }
    const listIds = new Set(allEntries.map(e => e.media.id));
    let html = `<div class="search-mode-hint"><span>Результати з каталогу AniList</span><button onclick="closeCatalog()">✕</button></div>`;
    for (const m of results) {
      const title = m.title.english || m.title.romaji;
      const inList = listIds.has(m.id);
      const meta = [m.format, m.episodes ? m.episodes+' еп.' : null, m.seasonYear].filter(Boolean).join(' · ');
      html += `
        <div class="catalog-item">
          <img src="${m.coverImage.medium}" class="catalog-cover" loading="lazy">
          <div class="catalog-info">
            <div class="catalog-title">${title}</div>
            <div class="catalog-meta">${meta}</div>
          </div>
          ${inList
            ? `<span class="catalog-add in-list">У списку</span>`
            : `<button class="catalog-add" onclick="addToList(${m.id}, event)">+ Додати</button>`
          }
        </div>
      `;
    }
    drop.innerHTML = html;
  } catch(e) {
    drop.innerHTML = `<div class="catalog-loading">Помилка: ${e.message}</div>`;
  }
}

function closeCatalog() {
  lastCatalogQuery = '';
  const drop = document.getElementById('catalog-results');
  drop.style.display = 'none';
  drop.innerHTML = '';
}

async function addToList(mediaId, event) {
  const btn = event.target;
  btn.textContent = '...';
  btn.disabled = true;
  try {
    const data = await gql(`
      mutation($mediaId: Int, $status: MediaListStatus) {
        SaveMediaListEntry(mediaId: $mediaId, status: $status) {
          id status score progress notes updatedAt
          media {
            id title { romaji english } coverImage { medium large }
            episodes season seasonYear
            relations { edges { relationType(version: 2) node { id type } } }
          }
        }
      }
    `, { mediaId, status: 'PLANNING' });
    const entry = data.SaveMediaListEntry;
    allEntries.push(entry);
    btn.textContent = 'У списку';
    btn.classList.add('in-list');
    btn.disabled = true;
    showToast('Додано до запланованого');
    renderList();
  } catch(e) {
    btn.textContent = '+ Додати';
    btn.disabled = false;
    showToast('Помилка: ' + e.message);
  }
}

// Close catalog on outside click
document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-wrap')) closeCatalog();
});

function renderList() {
  const container = document.getElementById('list-container');
  const search = (document.getElementById('search-input').value || '').toLowerCase().trim();
  const sort = document.getElementById('sort-select').value;

  // Filter by current tab
  let filtered = currentTab === 'ALL'
    ? [...allEntries]
    : allEntries.filter(e => e.status === currentTab);

  // Search — fuzzy match
  if (search) {
    filtered = filtered.filter(e => fuzzyMatch(search, getTitle(e.media)) || fuzzyMatch(search, e.media.title.romaji || ''));
  }

  // Stats
  renderStats(filtered);

  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="icon">📋</div><div>Список порожній</div></div>`;
    return;
  }

  if (groupingEnabled) {
    renderGrouped(filtered, sort, container);
  } else {
    renderFlat(filtered, sort, container);
  }
}

function renderStats(entries) {
  const bar = document.getElementById('stats-bar');
  const total = entries.length;
  const scored = entries.filter(e => e.score > 0);
  const avgScore = scored.length ? (scored.reduce((s,e)=>s+e.score,0)/scored.length).toFixed(1) : '—';
  const eps = entries.reduce((s,e)=>s+(e.progress||0),0);
  bar.innerHTML = `
    <div class="stat-chip"><strong>${total}</strong> аніме</div>
    <div class="stat-chip"><strong>${avgScore}</strong> середня оцінка</div>
    <div class="stat-chip"><strong>${eps}</strong> серій переглянуто</div>
  `;
}

function sortEntries(entries, sort) {
  return [...entries].sort((a, b) => {
    if (sort === 'title') return getTitle(a.media).localeCompare(getTitle(b.media));
    if (sort === 'score') return (b.score||0) - (a.score||0);
    if (sort === 'progress') return (b.progress||0) - (a.progress||0);
    if (sort === 'updated') return (b.updatedAt||0) - (a.updatedAt||0);
    return 0;
  });
}

function renderGrouped(entries, sort, container) {
  const groups = buildSeriesGroups(entries);

  // Sort groups by representative value
  groups.sort((ga, gb) => {
    const ra = ga[0], rb = gb[0];
    const sort_ = document.getElementById('sort-select').value;
    if (sort_ === 'title') return getSeriesTitle(ga).localeCompare(getSeriesTitle(gb));
    if (sort_ === 'score') {
      const avgA = ga.filter(e=>e.score>0).reduce((s,e)=>s+e.score,0) / (ga.filter(e=>e.score>0).length||1);
      const avgB = gb.filter(e=>e.score>0).reduce((s,e)=>s+e.score,0) / (gb.filter(e=>e.score>0).length||1);
      return avgB - avgA;
    }
    if (sort_ === 'updated') return (gb[gb.length-1].updatedAt||0) - (ga[ga.length-1].updatedAt||0);
    return 0;
  });

  let html = '<div class="anime-list">';
  for (const group of groups) {
    const isMulti = group.length > 1;
    const rep = group[0];
    const seriesTitle = getSeriesTitle(group);
    const cover = rep.media.coverImage.medium;
    const scored = group.filter(e=>e.score>0);
    const avgScore = scored.length ? (scored.reduce((s,e)=>s+e.score,0)/scored.length).toFixed(1) : null;
    const groupId = 'g_' + rep.media.id;

    if (isMulti) {
      html += `
        <div class="series-group" id="${groupId}">
          <div class="series-header" onclick="toggleGroup('${groupId}')">
            <img src="${cover}" class="series-cover" loading="lazy">
            <div class="series-info">
              <div class="series-title">${seriesTitle}</div>
              <div class="series-meta">
                <span class="season-count">${group.length} сезони</span>
                ${avgScore ? `<span class="series-score-avg">★ ${avgScore}</span>` : ''}
              </div>
            </div>
            <span class="chevron">▶</span>
          </div>
          <div class="seasons-list" style="display:none">
      `;
      for (const entry of group) {
        html += seasonRowHTML(entry);
      }
      html += `</div></div>`;
    } else {
      html += standaloneRowHTML(rep);
    }
  }
  html += '</div>';
  container.innerHTML = html;
}

function renderFlat(entries, sort, container) {
  const sorted = sortEntries(entries, sort);
  let html = '<div class="anime-list">';
  for (const entry of sorted) {
    html += standaloneRowHTML(entry);
  }
  html += '</div>';
  container.innerHTML = html;
}

function seasonRowHTML(entry) {
  const title = getTitle(entry.media);
  const yr = entry.media.seasonYear ? ` · ${entry.media.seasonYear}` : '';
  const eps = entry.media.episodes;
  const prog = entry.progress || 0;
  const cover = entry.media.coverImage.medium;
  const scoreStr = entry.score > 0 ? entry.score : '—';
  const scoreClass = entry.score > 0 ? '' : 'no-score';
  const isDone = eps && prog >= eps;
  const plusBtn = isDone ? '' : `<button class="btn-plus" onclick='quickPlus(${entry.id})' title="+1 серія">+</button>`;
  return `
    <div class="season-row">
      <img src="${cover}" class="season-cover" loading="lazy">
      <div class="season-info">
        <div class="season-title">${title}</div>
        <div class="season-submeta">
          <span class="status-badge status-${entry.status}">${statusLabel(entry.status)}</span>
          <span class="progress-text">${prog}${eps ? '/'+eps : ''} еп.</span>
          ${entry.notes ? `<span style="font-size:11px;color:var(--text-muted)" title="${entry.notes}">📝</span>` : ''}
        </div>
      </div>
      <div class="season-actions">
        <span class="score-badge ${scoreClass}">${scoreStr}</span>
        ${plusBtn}
        <button class="btn-sm btn-edit" onclick='openModal(${JSON.stringify(entry).replace(/'/g,"&#39;")})'>✎</button>
      </div>
    </div>
  `;
}

function standaloneRowHTML(entry) {
  const title = getTitle(entry.media);
  const eps = entry.media.episodes;
  const prog = entry.progress || 0;
  const cover = entry.media.coverImage.medium;
  const scoreStr = entry.score > 0 ? entry.score : '—';
  const scoreClass = entry.score > 0 ? '' : 'no-score';
  const isDone = eps && prog >= eps;
  const plusBtn = isDone ? '' : `<button class="btn-plus" onclick='quickPlus(${entry.id})' title="+1 серія">+</button>`;
  return `
    <div class="standalone-row">
      <img src="${cover}" class="standalone-cover" loading="lazy">
      <div class="standalone-info">
        <div class="standalone-title">${title}</div>
        <div class="standalone-meta">
          <span class="status-badge status-${entry.status}">${statusLabel(entry.status)}</span>
          <span class="progress-text">${prog}${eps ? '/'+eps : ''} еп.</span>
          ${entry.notes ? `<span style="font-size:11px;color:var(--text-muted)" title="${entry.notes}">📝</span>` : ''}
        </div>
      </div>
      <div class="season-actions">
        <span class="score-badge ${scoreClass}">${scoreStr}</span>
        ${plusBtn}
        <button class="btn-sm btn-edit" onclick='openModal(${JSON.stringify(entry).replace(/'/g,"&#39;")})'>✎</button>
      </div>
    </div>
  `;
}

function toggleGroup(id) {
  const el = document.getElementById(id);
  const sl = el.querySelector('.seasons-list');
  const isOpen = el.classList.contains('open');
  el.classList.toggle('open');
  sl.style.display = isOpen ? 'none' : 'block';
}

// ── QUICK +1 ──
async function quickPlus(entryId) {
  const entry = allEntries.find(e => e.id === entryId);
  if (!entry) return;
  const total = entry.media.episodes || 99999;
  const newProg = Math.min((entry.progress || 0) + 1, total);
  try {
    await updateEntry(entry.id, entry.status, entry.score, newProg, entry.notes);
    entry.progress = newProg;
    // auto-complete if reached total
    if (entry.media.episodes && newProg >= entry.media.episodes && entry.status === 'CURRENT') {
      entry.status = 'COMPLETED';
      await updateEntry(entry.id, 'COMPLETED', entry.score, newProg, entry.notes);
      showToast('Завершено! 🎉');
    } else {
      showToast(`${newProg}${entry.media.episodes ? '/'+entry.media.episodes : ''} серій`);
    }
    renderList();
  } catch(e) {
    showToast('Помилка: ' + e.message);
  }
}

// ── TABS ──
function setTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

function toggleGrouping(enabled) {
  groupingEnabled = enabled;
  document.getElementById('toggle-group').classList.toggle('active', enabled);
  document.getElementById('toggle-flat').classList.toggle('active', !enabled);
  renderList();
}

// ── MODAL ──
function openModal(entryJson) {
  const entry = typeof entryJson === 'string' ? JSON.parse(entryJson) : entryJson;
  editingEntry = entry;
  modalScore = entry.score || 0;
  modalStatus = entry.status;

  document.getElementById('modal-cover').src = entry.media.coverImage.large || entry.media.coverImage.medium;
  document.getElementById('modal-title').textContent = getTitle(entry.media);
  document.getElementById('modal-subtitle').textContent =
    (entry.media.season || '') + (entry.media.seasonYear ? ' ' + entry.media.seasonYear : '');
  document.getElementById('modal-progress').value = entry.progress || 0;
  document.getElementById('modal-total').textContent = entry.media.episodes || '?';
  document.getElementById('modal-notes').value = entry.notes || '';

  // Score buttons
  const sr = document.getElementById('score-row');
  sr.innerHTML = '';
  for (let i = 1; i <= 10; i++) {
    const btn = document.createElement('button');
    btn.className = 'score-btn' + (i === modalScore ? ' active' : '');
    btn.textContent = i;
    btn.onclick = () => { modalScore = i; sr.querySelectorAll('.score-btn').forEach((b,j)=>b.classList.toggle('active',j+1===i)); };
    sr.appendChild(btn);
  }

  // Status buttons
  document.querySelectorAll('.status-btn').forEach(b => {
    b.className = 'status-btn';
    if (b.dataset.status === modalStatus) b.classList.add('active-' + modalStatus);
  });

  document.getElementById('edit-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('edit-modal').classList.remove('open');
  editingEntry = null;
}

function setModalStatus(s) {
  modalStatus = s;
  document.querySelectorAll('.status-btn').forEach(b => {
    b.className = 'status-btn';
    if (b.dataset.status === s) b.classList.add('active-' + s);
  });
}

function adjustProgress(delta) {
  const inp = document.getElementById('modal-progress');
  const val = parseInt(inp.value) || 0;
  const total = editingEntry?.media?.episodes || 99999;
  inp.value = Math.max(0, Math.min(total, val + delta));
}

async function saveEntry() {
  if (!editingEntry) return;
  const progress = parseInt(document.getElementById('modal-progress').value) || 0;
  const notes = document.getElementById('modal-notes').value;
  try {
    await updateEntry(editingEntry.id, modalStatus, modalScore, progress, notes);
    // Update local state
    const idx = allEntries.findIndex(e => e.id === editingEntry.id);
    if (idx >= 0) {
      allEntries[idx].score = modalScore;
      allEntries[idx].status = modalStatus;
      allEntries[idx].progress = progress;
      allEntries[idx].notes = notes;
    }
    closeModal();
    renderList();
    showToast('Збережено ✓');
  } catch(e) {
    showToast('Помилка: ' + e.message);
  }
}

// ── INIT ──
async function initApp() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('app').style.flexDirection = 'column';
  document.getElementById('list-container').innerHTML = `<div class="loading"><div class="spinner"></div><div>Завантаження...</div></div>`;

  try {
    currentUser = await fetchUser();
    document.getElementById('user-name').textContent = currentUser.name;
    if (currentUser.avatar?.medium) {
      document.getElementById('user-avatar').src = currentUser.avatar.medium;
    }
    await loadList();
  } catch(e) {
    document.getElementById('list-container').innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><div>Помилка: ${e.message}</div></div>`;
  }
}

async function loadList() {
  document.getElementById('list-container').innerHTML = `<div class="loading"><div class="spinner"></div><div>Завантаження...</div></div>`;
  try {
    allEntries = await fetchList(currentUser.id);
    renderList();
  } catch(e) {
    document.getElementById('list-container').innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><div>Помилка завантаження: ${e.message}</div></div>`;
  }
}

// ── TOAST ──
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ── STARTUP ──
(function() {
  // Check for OAuth token in hash
  const hashToken = parseTokenFromHash();
  if (hashToken) {
    token = hashToken;
    localStorage.setItem('al_token', hashToken);
    window.history.replaceState({}, '', window.location.pathname);
    initApp();
    return;
  }
  // Check session
  const saved = localStorage.getItem('al_token');
  if (saved) {
    token = saved;
    initApp();
    return;
  }
  // Show auth
  document.getElementById('auth-screen').style.display = 'flex';
})();

// ── PWA SETUP ──
(function() {
  // Generate icon as SVG → PNG via canvas
  function makeIcon(size) {
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');

    // Background
    const grad = ctx.createLinearGradient(0, 0, size, size);
    grad.addColorStop(0, '#1a1825');
    grad.addColorStop(1, '#0d0d0f');
    ctx.fillStyle = grad;
    const r = size * 0.18;
    ctx.beginPath();
    ctx.moveTo(r, 0);
    ctx.lineTo(size - r, 0);
    ctx.quadraticCurveTo(size, 0, size, r);
    ctx.lineTo(size, size - r);
    ctx.quadraticCurveTo(size, size, size - r, size);
    ctx.lineTo(r, size);
    ctx.quadraticCurveTo(0, size, 0, size - r);
    ctx.lineTo(0, r);
    ctx.quadraticCurveTo(0, 0, r, 0);
    ctx.closePath();
    ctx.fill();

    // Accent glow circle
    const glow = ctx.createRadialGradient(size*0.5, size*0.42, 0, size*0.5, size*0.42, size*0.38);
    glow.addColorStop(0, 'rgba(124,106,247,0.25)');
    glow.addColorStop(1, 'rgba(124,106,247,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, size, size);

    // Cat ears
    const earW = size * 0.13;
    const earH = size * 0.16;
    const earY = size * 0.18;
    ctx.fillStyle = '#7c6af7';
    // left ear
    ctx.beginPath();
    ctx.moveTo(size*0.26, earY + earH);
    ctx.lineTo(size*0.26 + earW*0.5, earY);
    ctx.lineTo(size*0.26 + earW, earY + earH);
    ctx.closePath();
    ctx.fill();
    // right ear
    ctx.beginPath();
    ctx.moveTo(size*0.74 - earW, earY + earH);
    ctx.lineTo(size*0.74 - earW*0.5, earY);
    ctx.lineTo(size*0.74, earY + earH);
    ctx.closePath();
    ctx.fill();

    // Inner ear accent
    ctx.fillStyle = 'rgba(149,133,255,0.5)';
    const iEarW = earW * 0.5, iEarH = earH * 0.55;
    ctx.beginPath();
    ctx.moveTo(size*0.26 + earW*0.25, earY + earH - iEarH*0.1);
    ctx.lineTo(size*0.26 + earW*0.5, earY + earH*0.3);
    ctx.lineTo(size*0.26 + earW*0.75, earY + earH - iEarH*0.1);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(size*0.74 - earW*0.75, earY + earH - iEarH*0.1);
    ctx.lineTo(size*0.74 - earW*0.5, earY + earH*0.3);
    ctx.lineTo(size*0.74 - earW*0.25, earY + earH - iEarH*0.1);
    ctx.closePath();
    ctx.fill();

    // "NT" text
    ctx.fillStyle = '#e8e8f0';
    ctx.font = `700 ${size*0.3}px "Space Grotesk", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // N in dimmer color
    ctx.fillStyle = '#8888a0';
    ctx.fillText('N', size * 0.36, size * 0.62);
    // T in accent
    ctx.fillStyle = '#7c6af7';
    ctx.fillText('T', size * 0.64, size * 0.62);

    // Bottom accent line
    ctx.strokeStyle = '#7c6af7';
    ctx.lineWidth = size * 0.025;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(size*0.35, size*0.78);
    ctx.lineTo(size*0.65, size*0.78);
    ctx.stroke();

    return canvas.toDataURL('image/png');
  }

  const icon192 = makeIcon(192);
  const icon512 = makeIcon(512);

  // Set apple touch icon
  document.getElementById('apple-icon').href = icon512;

  // Inject manifest as blob
  const manifest = {
    name: 'NecoTrack',
    short_name: 'NecoTrack',
    start_url: 'https://dmy3xm.github.io/NecoTrack',
    display: 'standalone',
    background_color: '#0d0d0f',
    theme_color: '#0d0d0f',
    orientation: 'portrait',
    icons: [
      { src: icon192, sizes: '192x192', type: 'image/png' },
      { src: icon512, sizes: '512x512', type: 'image/png' }
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
  document.getElementById('manifest-link').href = URL.createObjectURL(blob);

  // Unregister any old service workers that may interfere
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => {
      for (const reg of regs) reg.unregister();
    });
    navigator.serviceWorker.addEventListener('controllerchange', () => window.location.reload());
  }
})();
</script>
